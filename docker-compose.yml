version: "3.9"

services:
  reader:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STREAM_SERVER: https://host.docker.internal:3000
      OCR_BACKEND: ${OCR_BACKEND:-deepseek_ocr}
      OCR_DEEPSEEK_HOST: http://host.docker.internal:11434
      OCR_DEEPSEEK_PATH: ${OCR_DEEPSEEK_PATH:-/api/generate}
      OCR_DEEPSEEK_API_STYLE: ${OCR_DEEPSEEK_API_STYLE:-generate}
      OCR_DEEPSEEK_MODEL: ${OCR_DEEPSEEK_MODEL:-deepseek-ocr}
      OCR_DEEPSEEK_PROMPT: ${OCR_DEEPSEEK_PROMPT:-<|grounding|>Convert the document to markdown.}
      OCR_DEEPSEEK_OPENAI_BASE_URL: ${OCR_DEEPSEEK_OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}
      OCR_DEEPSEEK_OPENAI_API_KEY: ${OCR_DEEPSEEK_OPENAI_API_KEY:-EMPTY}
      OCR_DEEPSEEK_OPENAI_MODEL: ${OCR_DEEPSEEK_OPENAI_MODEL:-deepseek-ai/DeepSeek-OCR}
      OCR_DEEPSEEK_OPENAI_MAX_TOKENS: ${OCR_DEEPSEEK_OPENAI_MAX_TOKENS:-4096}
      OCR_DEEPSEEK_OPENAI_EXTRA_BODY: ${OCR_DEEPSEEK_OPENAI_EXTRA_BODY:-}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  nginx:
    image: nginx:1.27
    depends_on:
      - reader
    ports:
      - "3001:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOME}/dev/certs2:/certs:ro
    restart: unless-stopped
