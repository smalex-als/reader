services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  reader:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
      BACKGROUND_JOB_CONCURRENCY: ${BACKGROUND_JOB_CONCURRENCY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      STREAM_SERVER: http://host.docker.internal:3005
      STREAM_PCM_INITIAL_BUFFER_SECONDS: ${STREAM_PCM_INITIAL_BUFFER_SECONDS:-5}
      STREAM_PCM_GENERATION_REALTIME_FACTOR: ${STREAM_PCM_GENERATION_REALTIME_FACTOR:-1.5}
      STREAM_PCM_SPEECH_WORDS_PER_MINUTE: ${STREAM_PCM_SPEECH_WORDS_PER_MINUTE:-150}
      STREAM_PCM_MAX_INITIAL_BUFFER_SECONDS: ${STREAM_PCM_MAX_INITIAL_BUFFER_SECONDS:-45}
      OCR_BACKEND: ${OCR_BACKEND:-deepseek_ocr}
      OCR_DEEPSEEK_HOST: http://host.docker.internal:11434
      OCR_DEEPSEEK_CONCURRENCY: ${OCR_DEEPSEEK_CONCURRENCY:-1}
      OCR_DEEPSEEK_PATH: ${OCR_DEEPSEEK_PATH:-/api/generate}
      OCR_DEEPSEEK_MODEL: ${OCR_DEEPSEEK_MODEL:-deepseek-ocr}
      OCR_DEEPSEEK_PROMPT: ${OCR_DEEPSEEK_PROMPT:-\n<|grounding|>Convert the\ndocument to markdown.}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
  nginx:
    profiles: ["https"]
    image: nginx:1.27
    depends_on:
      reader:
        condition: service_healthy
    ports:
      - "3001:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOME}/dev/certs2:/certs:ro
    restart: unless-stopped

volumes:
  redis-data:
