services:
  jobworker:
    build:
      context: ./services/jobworker
      dockerfile: Dockerfile
    depends_on:
      sync-subtitles:
        condition: service_healthy
    environment:
      JOBWORKER_HOST: 0.0.0.0
      JOBWORKER_PORT: 3200
      JOBWORKER_DATA_DIR: /data
      JOBWORKER_SYNC_SUBTITLES_URL: http://sync-subtitles:3100
      JOBWORKER_READER_SUBTITLE_SUBMIT_URL: http://reader:3000/api/jobs/subtitles/submit
      JOBWORKER_SUBTITLE_TIMEOUT_MS: ${CHAPTER_SUBTITLES_TIMEOUT_MS:-1800000}
      JOBWORKER_SUBTITLE_POLL_INTERVAL_MS: ${CHAPTER_SUBTITLES_POLL_INTERVAL_MS:-2000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ./data:/data
    restart: unless-stopped
  sync-subtitles:
    platform: linux/amd64
    build:
      context: ./services/sync-subtitles
      dockerfile: Dockerfile
    command: serve
    environment:
      SYNC_SUBTITLES_HOST: 0.0.0.0
      SYNC_SUBTITLES_PORT: 3100
      SYNC_SUBTITLES_DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3100/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    volumes:
      - ./data:/data
    restart: unless-stopped
  reader:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      jobworker:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      STREAM_SERVER: http://host.docker.internal:3005
      OCR_BACKEND: ${OCR_BACKEND:-deepseek_ocr}
      OCR_DEEPSEEK_HOST: http://host.docker.internal:11434
      OCR_DEEPSEEK_CONCURRENCY: ${OCR_DEEPSEEK_CONCURRENCY:-1}
      OCR_DEEPSEEK_PATH: ${OCR_DEEPSEEK_PATH:-/api/generate}
      OCR_DEEPSEEK_MODEL: ${OCR_DEEPSEEK_MODEL:-deepseek-ocr}
      OCR_DEEPSEEK_PROMPT: ${OCR_DEEPSEEK_PROMPT:-\n<|grounding|>Convert the\ndocument to markdown.}
      CHAPTER_JOBWORKER_URL: ${CHAPTER_JOBWORKER_URL:-http://jobworker:3200/jobs/subtitles}
      CHAPTER_SUBTITLES_LANGUAGE: ${CHAPTER_SUBTITLES_LANGUAGE:-auto}
      CHAPTER_SUBTITLES_SENTENCE_MODE: ${CHAPTER_SUBTITLES_SENTENCE_MODE:-strict}
      CHAPTER_SUBTITLES_MAX_LINE_CHARS: ${CHAPTER_SUBTITLES_MAX_LINE_CHARS:-95}
      CHAPTER_SUBTITLES_BEAM: ${CHAPTER_SUBTITLES_BEAM:-100}
      CHAPTER_SUBTITLES_RETRY_BEAM: ${CHAPTER_SUBTITLES_RETRY_BEAM:-400}
      CHAPTER_SUBTITLES_SKIP_VALIDATE: ${CHAPTER_SUBTITLES_SKIP_VALIDATE:-true}
      CHAPTER_SUBTITLES_TIMEOUT_MS: ${CHAPTER_SUBTITLES_TIMEOUT_MS:-1800000}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  nginx:
    image: nginx:1.27
    depends_on:
      - reader
    ports:
      - "3001:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOME}/dev/certs2:/certs:ro
    restart: unless-stopped
